# Blueprint do Render: cria o banco PostgreSQL e a API Node de uma vez.
# No Render: New + > Blueprint > selecione o repositório (com este arquivo em backend/).
databases:
  - name: trifarmas-db
    plan: free
    databaseName: trifarmas
    user: trifarmas

services:
  - type: web
    name: trifarmas-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trifarmas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 798411665059-b1fhn4gfljnsi3efm3o9lacudd11a4f2.apps.googleusercontent.com
      - key: CORS_ORIGINS
        sync: false   # preencha com a URL do Vercel, ex: https://trifarmas.vercel.app
      - key: ALLOW_DEMO_GOOGLE
        value: "true"
      # Senha do painel da farmácia (/farmacia.html). Sem ela, ninguém consegue
      # confirmar a retirada de um pedido — e os pontos nunca são creditados.
      - key: PHARMACY_PIN
        sync: false   # escolha uma senha para o balcão
      - key: SIMULATE_DAILY_PRICES
        value: "true"
      - key: PASSWORD_RESET_ECHO
        value: "false"
