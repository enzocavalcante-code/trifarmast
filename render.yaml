databases:
  - name: trifarmas-db
    plan: free
    databaseName: trifarmas
    user: trifarmas

services:
  - type: web
    name: trifarmas-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 798411665059-b1fhn4gfljnsi3efm3o9lacudd11a4f2.apps.googleusercontent.com
      - key: CORS_ORIGINS
        sync: false   
      - key: PHARMACY_PIN
        sync: false   # senha do balcão da farmácia (frontend/pharmacy.html): 6 caracteres ou mais
